<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Desain Halaman Login - Simpel Momen Dukcapil Sangihe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020b1c;
      overflow-x: hidden;
      position: relative;
      color: #fff;
    }

    /* Ambient Glowing Blue Orbs Background */
    .bg-glow-1 {
      position: absolute;
      top: -15%;
      left: -10%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(14, 116, 244, 0.45) 0%, rgba(3, 37, 94, 0.15) 50%, transparent 75%);
      filter: blur(80px);
      pointer-events: none;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.35) 0%, rgba(2, 60, 140, 0.15) 50%, transparent 75%);
      filter: blur(90px);
      pointer-events: none;
      animation: floatOrb 14s ease-in-out infinite alternate-reverse;
    }

    .bg-grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(59, 130, 246, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(59, 130, 246, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.1); }
    }

    /* Floating Status Badge / Banner Preview Notice */
    .preview-pill {
      position: fixed;
      top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      background: rgba(14, 116, 244, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 9999px;
      color: #7dd3fc;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }

    .preview-pill .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }

    /* Login Card Pro (Glassmorphism Royale Blue) */
    .login-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: 20px;
      z-index: 10;
    }

    .login-card-pro {
      background: rgba(10, 25, 52, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 28px;
      padding: 2.75rem 2.25rem 2.25rem;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 
        0 25px 60px -12px rgba(0, 0, 0, 0.7),
        0 0 40px rgba(14, 116, 244, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .login-card-pro:hover {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 
        0 30px 70px -12px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(14, 116, 244, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Logo Header */
    .logo-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-wrapper-transparent {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      margin-bottom: 1rem;
      background: rgba(14, 116, 244, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(14, 116, 244, 0.15);
    }

    .logo-transparent-img {
      max-width: 175px;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.35));
    }

    .app-title-pro {
      font-family: 'Outfit', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #93c5fd 75%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .app-tagline-pro {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
      line-height: 1.4;
    }

    /* Form Inputs */
    .form-group-pro {
      margin-bottom: 1.35rem;
    }

    .form-label-pro {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper-pro {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-pro {
      position: absolute;
      left: 14px;
      font-size: 1.05rem;
      color: #38bdf8;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .input-field-pro {
      width: 100%;
      padding: 13px 42px 13px 44px;
      background: rgba(4, 18, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 500;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-field-pro::placeholder {
      color: #64748b;
      font-weight: 400;
    }

    .input-field-pro:focus {
      border-color: #38bdf8;
      background: rgba(4, 18, 42, 0.95);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2), 0 8px 20px rgba(14, 116, 244, 0.15);
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 1rem;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s ease;
    }

    .toggle-password-btn:hover {
      color: #38bdf8;
    }

    /* Submit Button Pro */
    .btn-login-pro {
      width: 100%;
      padding: 14px;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, #2563eb 0%, #0284c7 50%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px -4px rgba(14, 116, 244, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: all 0.25s ease;
    }

    .btn-login-pro:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -4px rgba(14, 116, 244, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      filter: brightness(1.06);
    }

    .btn-login-pro:active {
      transform: translateY(0);
    }

    /* Security Notice & Footer */
    .login-footer-pro {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .footer-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #60a5fa;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .footer-copy {
      font-size: 0.72rem;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Floating Indicator Notice -->
  <div class="preview-pill">
    <span class="pulse-dot"></span>
    PREVIEW DESAIN HALAMAN LOGIN PRO (TEMA BIRU & LOGO TRANSPARAN)
  </div>

  <!-- Background Orbs -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-grid-pattern"></div>

  <!-- Main Login Card -->
  <div class="login-container">
    <div class="login-card-pro">
      
      <!-- Brand & Transparent Logo -->
      <div class="logo-header">
        <div class="logo-wrapper-transparent">
          <img src="logo-transparent.png" alt="Dukcapil Sangihe" class="logo-transparent-img">
        </div>
        <h1 class="app-title-pro">Simpel Momen</h1>
        <p class="app-tagline-pro">Sistem Informasi Pelayanan & Monitoring Dokumen Terintegrasi Berjenjang</p>
      </div>

      <!-- Login Form Mockup -->
      <form onsubmit="event.preventDefault(); alert('Ini adalah preview desain! Semua elemen sudah siap diintegrasikan ke sistem utama.');">
        
        <div class="form-group-pro">
          <label class="form-label-pro">
            <span>Nama Pengguna (Username)</span>
          </label>
          <div class="input-wrapper-pro">
            <span class="input-icon-pro">👤</span>
            <input type="text" class="input-field-pro" placeholder="Masukkan ID / Username..." value="operator_dinas" required>
          </div>
        </div>

        <div class="form-group-pro">
          <label class="form-label-pro">
            <span>Kata Sandi (Password)</span>
          </label>
          <div class="input-wrapper-pro">
            <span class="input-icon-pro">🔒</span>
            <input type="password" id="previewPassword" class="input-field-pro" placeholder="Masukkan kata sandi..." value="123456" required>
            <button type="button" class="toggle-password-btn" onclick="togglePass()" title="Tampilkan / Sembunyikan Password">
              <span id="eyeIcon">👁️</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login-pro">
          <span>Masuk ke Sistem</span>
          <span>➜</span>
        </button>

      </form>

      <!-- Footer Info -->
      <div class="login-footer-pro">
        <div class="footer-badge">
          <span>🛡️</span> Dukcapil Kabupaten Kepulauan Sangihe
        </div>
        <div class="footer-copy">
          Simpel Momen Enterprise Web v.2.0.2 • Copyright &copy; DiJe 2026
        </div>
      </div>

    </div>
  </div>

  <script>
    function togglePass() {
      const input = document.getElementById('previewPassword');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈';
      } else {
        input.type = 'password';
        icon.textContent = '👁️';
      }
    }
  </script>
</body>
</html>
